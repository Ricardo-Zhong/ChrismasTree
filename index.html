<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christmas Tree Assembly</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
      }
      canvas {
        display: block;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-family: sans-serif;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px 20px;
        border-radius: 8px;
        transition: opacity 0.5s;
        z-index: 200;
      }
      #greeting {
        position: absolute;
        top: 8%;
        left: 0;
        width: 100%;
        text-align: center;
        color: #ffffff;
        font-family: "Great Vibes", cursive;
        font-size: clamp(3rem, 8vw, 6rem);
        font-weight: normal;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.8),
          0 0 20px rgba(173, 216, 230, 0.6), 0 0 40px rgba(135, 206, 250, 0.4);
        z-index: 100;
        pointer-events: none;
        opacity: 0; /* Start invisible */
        transition: opacity 3s ease-in-out;
        letter-spacing: 2px;
      }

      .vinyl-mini {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        position: absolute;
        bottom: 5%;
        left: 2%;
        cursor: pointer;
        /* 缩小阴影，使其看起来更精致 */
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        border: 1px solid #000;

        /* --- 针对小尺寸优化的纹理 --- */
        background: 
            /* 1. 反光层 (增强透明度，避免在小尺寸下遮挡纹理) */ linear-gradient(
            135deg,
            transparent 40%,
            rgba(255, 255, 255, 0.3) 50%,
            transparent 60%
          ),
          /* 2. 中心红色标签 (稍微调大一点比例，不然看不清) */
            radial-gradient(circle, #169fc9 35%, transparent 36%),
          /* 3. 黑胶纹理 (线条间距调整为 1px-2px，避免摩尔纹干扰) */
            repeating-radial-gradient(#111 0, #111 1px, #333 2px);

        /* 动画设置 */
        animation: spin 3s linear infinite; /* 小尺寸转快一点看起来更有活力 */
        animation-play-state: paused;
      }

      /* 中间的孔 (相应缩小) */
      .vinyl-mini::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 6px; /* 调整为 6px */
        height: 6px;
        background-color: #fff; /* 假设背景是白色，如果是深色背景请修改这里 */
        border-radius: 50%;
        border: 1px solid #ddd;
      }

      /* 旋转动画关键帧 */
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* 播放状态 */
      .vinyl-mini.playing {
        animation-play-state: running;
      }
    </style>
  </head>
  <body>
    <div id="loading">Gathering Particles...</div>
    <div id="greeting">Merry Christmas</div>
    <audio id="bgm" src="bgm.mp3" loop></audio>

    <div class="vinyl-mini" id="discBtn" onclick="toggleMusic()"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      var audio = document.getElementById("bgm");
      var cdBtn = document.getElementById("discBtn");
      function toggleMusic() {
        if (audio.paused) {
          audio.play();
          // 添加 .playing 类，开始旋转
          cdBtn.classList.add("playing");
        } else {
          audio.pause();
          // 移除 .playing 类，停止旋转
          cdBtn.classList.remove("playing");
        }
      }
      function playMusic() {
        audio
          .play()
          .then(() => {
            // 播放成功后，移除监听器，避免每次点击都触发
            document.removeEventListener("click", playMusic);
            document.removeEventListener("touchstart", playMusic); // 兼容手机触摸
            cdBtn.classList.add("playing");
            // 如果你有旋转动画，记得在这里加上 class
            // document.getElementById("musicBtn").classList.add("playing");
          })
          .catch((error) => {
            console.log("播放被阻止:", error);
          });
      }

      // 监听整个文档的点击或触摸事件
      // { once: true } 表示事件只触发一次，触发后自动销毁，节省性能
      document.addEventListener("click", playMusic, { once: true });
      document.addEventListener("touchstart", playMusic, { once: true });
      // ------------------------------------------------------------------
      // Setup Scene, Camera, Renderer
      // ------------------------------------------------------------------
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000103);
      scene.fog = new THREE.FogExp2(0x000103, 0.01);

      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 5, 50);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      document.body.appendChild(renderer.domElement);

      // ------------------------------------------------------------------
      // AURORA BOREALIS
      // ------------------------------------------------------------------
      const auroraVertexShader = `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `;

      const auroraFragmentShader = `
        uniform float uTime;
        varying vec2 vUv;
        float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
        }
        float noise(vec2 st) {
            vec2 i = floor(st);
            vec2 f = fract(st);
            float a = random(i);
            float b = random(i + vec2(1.0, 0.0));
            float c = random(i + vec2(0.0, 1.0));
            float d = random(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
        }
        void main() {
            vec2 uv = vUv;
            float time = uTime * 0.2;
            float wave = sin(uv.x * 6.0 + time) * 0.1 + sin(uv.x * 12.0 + time * 1.5) * 0.05;
            float n = noise(vec2(uv.x * 4.0 + time, uv.y * 2.0));
            float alpha = smoothstep(0.3, 0.9, uv.y);
            vec3 colorGreen = vec3(0.1, 1.0, 0.6);
            vec3 colorPurple = vec3(0.6, 0.2, 1.0);
            vec3 finalColor = mix(colorGreen, colorPurple, uv.y * 0.8 + n * 0.2);
            float intensity = alpha * (0.3 + 0.5 * n);
            intensity += smoothstep(0.8, 0.9, n) * alpha * 0.5;
            gl_FragColor = vec4(finalColor, intensity * 0.6); 
        }
      `;

      const auroraUniforms = { uTime: { value: 0 } };
      const auroraMaterial = new THREE.ShaderMaterial({
        vertexShader: auroraVertexShader,
        fragmentShader: auroraFragmentShader,
        uniforms: auroraUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        depthWrite: false,
      });

      const auroraGeometry = new THREE.PlaneGeometry(400, 200, 64, 64);
      const auroraMesh = new THREE.Mesh(auroraGeometry, auroraMaterial);
      auroraMesh.position.set(0, 20, -30);
      scene.add(auroraMesh);

      // ------------------------------------------------------------------
      // Materials
      // ------------------------------------------------------------------
      const colBlack = new THREE.Color(0x1a1a1a);
      const colPureWhite = new THREE.Color(0xffffff);
      const colDarkBlue = new THREE.Color(0x446699);
      const colGrey = new THREE.Color(0xaaaaaa);
      const colLightBlue = new THREE.Color(0xaaddff);
      const colSequinBlack = new THREE.Color(0x111111);

      const sequinColors = [
        new THREE.Color(0xffffff),
        new THREE.Color(0xaaddff),
        new THREE.Color(0x88ccff),
        new THREE.Color(0xccccff),
        new THREE.Color(0xdddddd),
      ];

      const particleMaterial = new THREE.MeshStandardMaterial({
        roughness: 0.2,
        metalness: 0.1,
        flatShading: true,
        emissive: 0x222222,
        emissiveIntensity: 0.6,
      });

      const material2D = new THREE.MeshStandardMaterial({
        roughness: 0.2,
        metalness: 0.1,
        side: THREE.DoubleSide,
        emissive: 0x222222,
        emissiveIntensity: 0.5,
      });

      const materialGlass = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.1,
        roughness: 0.5,
        transmission: 0.9,
        transparent: true,
        thickness: 1.0,
        envMapIntensity: 1.0,
        clearcoat: 0.5,
        clearcoatRoughness: 0.1,
      });

      const materialSequin = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        metalness: 1.0,
        roughness: 0.1,
        side: THREE.DoubleSide,
        emissive: 0x222222,
        emissiveIntensity: 0.2,
      });

      function createSnowflakeTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.shadowBlur = 5;
        ctx.shadowColor = "#aaddff";
        ctx.translate(32, 32);
        for (let i = 0; i < 6; i++) {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(0, -26);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, -12);
          ctx.lineTo(-8, -18);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, -12);
          ctx.lineTo(8, -18);
          ctx.stroke();
          ctx.rotate(Math.PI / 3);
        }
        return new THREE.CanvasTexture(canvas);
      }

      const snowflakeTexture = createSnowflakeTexture();
      const materialSnowflake = new THREE.MeshStandardMaterial({
        map: snowflakeTexture,
        transparent: true,
        alphaTest: 0.1,
        side: THREE.DoubleSide,
        emissive: 0x4488ff,
        emissiveIntensity: 0.5,
        roughness: 0.1,
        metalness: 0.8,
      });

      // ------------------------------------------------------------------
      // Data Management
      // ------------------------------------------------------------------
      const particleData = [];
      const treeGroup = new THREE.Group();
      treeGroup.position.y = 2;
      treeGroup.scale.set(1.2, 1.2, 1.2);
      scene.add(treeGroup);

      // Geometries
      const geoSphere = new THREE.IcosahedronGeometry(0.72, 1);
      const geoCube = new THREE.BoxGeometry(0.84, 0.84, 0.84);
      const geoTetra = new THREE.TetrahedronGeometry(0.84);
      const geoDisc = new THREE.CircleGeometry(0.5, 32);
      const geoPlane = new THREE.PlaneGeometry(0.7, 0.7);
      const geoSnowflake = new THREE.PlaneGeometry(1.8, 1.8);
      const geoGlassOrb = new THREE.SphereGeometry(0.65, 32, 32);
      const geoSequinSquare = new THREE.PlaneGeometry(0.7, 0.7);
      const geoSequinRound = new THREE.CircleGeometry(0.4, 32);

      // Meshes
      const meshSphere = new THREE.InstancedMesh(
        geoSphere,
        particleMaterial,
        126
      );
      const meshCube = new THREE.InstancedMesh(geoCube, particleMaterial, 35);
      const meshTetra = new THREE.InstancedMesh(geoTetra, particleMaterial, 35);
      const meshDisc = new THREE.InstancedMesh(geoDisc, material2D, 180);
      const meshPlane = new THREE.InstancedMesh(geoPlane, material2D, 50);
      const meshSnowflake = new THREE.InstancedMesh(
        geoSnowflake,
        materialSnowflake,
        100
      );
      const meshGlass = new THREE.InstancedMesh(geoGlassOrb, materialGlass, 60);
      const meshSequinSquare = new THREE.InstancedMesh(
        geoSequinSquare,
        materialSequin,
        195
      );
      const meshSequinRound = new THREE.InstancedMesh(
        geoSequinRound,
        materialSequin,
        195
      );

      const dummy = new THREE.Object3D();

      // --- Helper to get random start position for assembly animation ---
      function getRandomStartPosition() {
        const range = 250; // Spread wide
        return new THREE.Vector3(
          (Math.random() - 0.5) * range,
          (Math.random() - 0.5) * range + 20, // slightly higher bias
          (Math.random() - 0.5) * range
        );
      }

      function fillInstancedMesh(mesh) {
        for (let i = 0; i < mesh.count; i++) {
          let y;
          while (true) {
            y = Math.random() * 20;
            const t = y / 20;
            const threshold = 1.0 - 0.65 * t;
            if (Math.random() < threshold) break;
          }
          const maxRadius = 8 * (1 - y / 20);
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.random() * maxRadius;
          const x = Math.cos(angle) * radius;
          const z = Math.sin(angle) * radius;

          // Target Position (The Tree)
          const targetPos = new THREE.Vector3(x, y - 10, z);

          // Start Position (Chaos)
          const startPos = getRandomStartPosition();

          dummy.position.copy(startPos); // Initialize at start position
          dummy.rotation.set(
            Math.random() * Math.PI,
            Math.random() * Math.PI,
            Math.random() * Math.PI
          );

          const randomScale = 0.5 + Math.random() * 0.8;
          const heightFactor = 1.0 - (y / 20) * 0.5;
          const finalScale = randomScale * heightFactor;

          dummy.scale.set(finalScale, finalScale, finalScale);
          dummy.updateMatrix();
          mesh.setMatrixAt(i, dummy.matrix);

          const r = Math.random();
          let baseColor =
            r < 0.5 ? colPureWhite : r < 0.8 ? colBlack : colDarkBlue;
          mesh.setColorAt(i, baseColor);

          particleData.push({
            mesh: mesh,
            index: i,
            startPosition: startPos, // New Property
            originalPosition: targetPos,
            currentPosition: startPos.clone(),
            rotation: dummy.rotation.clone(),
            baseScale: finalScale,
            baseColor: baseColor.clone(),
          });
        }
        mesh.instanceMatrix.needsUpdate = true;
        mesh.instanceColor.needsUpdate = true;
        treeGroup.add(mesh);
      }

      function fill2DInstancedMesh(mesh, isSnowflake = false) {
        for (let i = 0; i < mesh.count; i++) {
          let y;
          while (true) {
            y = Math.random() * 20;
            const t = y / 20;
            const threshold = 1.0 - 0.65 * t;
            if (Math.random() < threshold) break;
          }
          const maxRadius = 8 * (1 - y / 20);
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.random() * maxRadius;
          const x = Math.cos(angle) * radius;
          const z = Math.sin(angle) * radius;

          const targetPos = new THREE.Vector3(x, y - 10, z);
          const startPos = getRandomStartPosition();

          dummy.position.copy(startPos);
          dummy.rotation.set(
            Math.random() * Math.PI,
            Math.random() * Math.PI,
            Math.random() * Math.PI
          );

          const randomScale = 0.5 + Math.random() * 0.8;
          const heightFactor = 1.0 - (y / 20) * 0.5;
          const finalScale = randomScale * heightFactor;

          dummy.scale.set(finalScale, finalScale, finalScale);
          dummy.updateMatrix();
          mesh.setMatrixAt(i, dummy.matrix);

          let baseColor;
          if (isSnowflake) {
            baseColor = Math.random() > 0.5 ? colPureWhite : colLightBlue;
          } else {
            const r = Math.random();
            baseColor =
              r < 0.4 ? colPureWhite : r < 0.7 ? colGrey : colLightBlue;
          }
          mesh.setColorAt(i, baseColor);

          particleData.push({
            mesh: mesh,
            index: i,
            startPosition: startPos,
            originalPosition: targetPos,
            currentPosition: startPos.clone(),
            rotation: dummy.rotation.clone(),
            baseScale: finalScale,
            baseColor: baseColor.clone(),
          });
        }
        mesh.instanceMatrix.needsUpdate = true;
        mesh.instanceColor.needsUpdate = true;
        treeGroup.add(mesh);
      }

      function fillGlassMesh(mesh) {
        for (let i = 0; i < mesh.count; i++) {
          let y;
          while (true) {
            y = Math.random() * 20;
            const t = y / 20;
            const threshold = 1.0 - 0.65 * t;
            if (Math.random() < threshold) break;
          }
          const maxRadius = 8 * (1 - y / 20);
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.random() * maxRadius;
          const x = Math.cos(angle) * radius;
          const z = Math.sin(angle) * radius;

          const targetPos = new THREE.Vector3(x, y - 10, z);
          const startPos = getRandomStartPosition();

          dummy.position.copy(startPos);
          dummy.rotation.set(
            Math.random() * Math.PI,
            Math.random() * Math.PI,
            Math.random() * Math.PI
          );

          const randomScale = 0.5 + Math.random() * 0.8;
          const heightFactor = 1.0 - (y / 20) * 0.5;
          const finalScale = randomScale * heightFactor;

          dummy.scale.set(finalScale, finalScale, finalScale);
          dummy.updateMatrix();
          mesh.setMatrixAt(i, dummy.matrix);

          particleData.push({
            mesh: mesh,
            index: i,
            startPosition: startPos,
            originalPosition: targetPos,
            currentPosition: startPos.clone(),
            rotation: dummy.rotation.clone(),
            baseScale: finalScale,
            baseColor: new THREE.Color(0xffffff),
          });
        }
        mesh.instanceMatrix.needsUpdate = true;
        treeGroup.add(mesh);
      }

      function fillSequinMesh(mesh) {
        for (let i = 0; i < mesh.count; i++) {
          let y;
          while (true) {
            y = Math.random() * 20;
            const t = y / 20;
            const threshold = 1.0 - 0.65 * t;
            if (Math.random() < threshold) break;
          }
          const maxRadius = 8 * (1 - y / 20);
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.random() * maxRadius;
          const x = Math.cos(angle) * radius;
          const z = Math.sin(angle) * radius;

          const targetPos = new THREE.Vector3(x, y - 10, z);
          const startPos = getRandomStartPosition();

          dummy.position.copy(startPos);
          dummy.rotation.set(
            Math.random() * Math.PI,
            Math.random() * Math.PI,
            Math.random() * Math.PI
          );

          const randomScale = 0.5 + Math.random() * 0.8;
          const heightFactor = 1.0 - (y / 20) * 0.5;
          const finalScale = randomScale * heightFactor;

          dummy.scale.set(finalScale, finalScale, finalScale);
          dummy.updateMatrix();
          mesh.setMatrixAt(i, dummy.matrix);

          let baseColor;
          if (Math.random() < 0.2) {
            baseColor = colSequinBlack;
          } else {
            const colIndex = Math.floor(Math.random() * sequinColors.length);
            baseColor = sequinColors[colIndex];
          }
          mesh.setColorAt(i, baseColor);

          particleData.push({
            mesh: mesh,
            index: i,
            startPosition: startPos,
            originalPosition: targetPos,
            currentPosition: startPos.clone(),
            rotation: dummy.rotation.clone(),
            baseScale: finalScale,
            baseColor: baseColor.clone(),
          });
        }
        mesh.instanceMatrix.needsUpdate = true;
        mesh.instanceColor.needsUpdate = true;
        treeGroup.add(mesh);
      }

      fillInstancedMesh(meshSphere);
      fillInstancedMesh(meshCube);
      fillInstancedMesh(meshTetra);
      fill2DInstancedMesh(meshDisc);
      fill2DInstancedMesh(meshPlane);
      fill2DInstancedMesh(meshSnowflake, true);
      fillGlassMesh(meshGlass);
      fillSequinMesh(meshSequinSquare);
      fillSequinMesh(meshSequinRound);

      // ------------------------------------------------------------------
      // Sparkles (Wait to activate)
      // ------------------------------------------------------------------
      const sparkleGroup = new THREE.Group();
      treeGroup.add(sparkleGroup);
      const sparkleCanvas = document.createElement("canvas");
      sparkleCanvas.width = 32;
      sparkleCanvas.height = 32;
      const sCtx = sparkleCanvas.getContext("2d");
      const sGrad = sCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
      sGrad.addColorStop(0, "rgba(255, 255, 255, 1)");
      sGrad.addColorStop(0.4, "rgba(255, 255, 255, 0.5)");
      sGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
      sCtx.fillStyle = sGrad;
      sCtx.fillRect(0, 0, 32, 32);
      const sparkleTexture = new THREE.CanvasTexture(sparkleCanvas);
      const sparkles = [];
      const sparkleCount = 60;

      for (let i = 0; i < sparkleCount; i++) {
        const material = new THREE.SpriteMaterial({
          map: sparkleTexture,
          color: 0xffffff,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
        });
        const sprite = new THREE.Sprite(material);
        sprite.position.set(0, -100, 0);
        sprite.scale.set(1.2, 1.2, 1.2);
        sparkleGroup.add(sprite);
        sparkles.push({ sprite: sprite, active: false, life: 0, speed: 0 });
      }

      function updateSparkles(delta, isAssembled) {
        if (!isAssembled) return; // Don't sparkle while assembling
        sparkles.forEach((s) => {
          if (!s.active) {
            if (Math.random() < 0.01) {
              s.active = true;
              s.life = 0;
              s.speed = 1.0 + Math.random() * 2.0;
              const y = Math.random() * 20;
              const treeRadius = 8 * (1 - y / 20);
              const maxR = treeRadius + 5.0;
              const r = Math.random() * maxR;
              const theta = Math.random() * Math.PI * 2;
              s.sprite.position.set(
                Math.cos(theta) * r,
                y - 10,
                Math.sin(theta) * r
              );
            }
          } else {
            s.life += delta * s.speed;
            if (s.life > Math.PI) {
              s.active = false;
              s.sprite.material.opacity = 0;
            } else {
              s.sprite.material.opacity = Math.sin(s.life);
              const scale = (0.5 + Math.sin(s.life) * 0.5) * 1.5;
              s.sprite.scale.set(scale, scale, scale);
            }
          }
        });
      }

      // ------------------------------------------------------------------
      // Spiral Dust (Animated)
      // ------------------------------------------------------------------
      const spiralPoints = [];
      const spiralHeight = 22;
      const loops = 4.5;
      const pointsCount = 1500;
      for (let i = 0; i <= pointsCount; i++) {
        const t = i / pointsCount;
        const y = t * spiralHeight - 10;
        const r = 9 * (1 - t) + 0.5;
        const angle = t * Math.PI * 2 * loops;
        spiralPoints.push(
          new THREE.Vector3(Math.cos(angle) * r, y, Math.sin(angle) * r)
        );
      }
      const spiralCurve = new THREE.CatmullRomCurve3(
        spiralPoints,
        false,
        "centripetal",
        0.1
      );

      const spiralDustGeo = new THREE.BufferGeometry();
      const spiralDustCount = 4500;
      const spiralDustPos = new Float32Array(spiralDustCount * 3);

      // Store Start and End positions for spiral particles
      const spiralTargetPos = new Float32Array(spiralDustCount * 3);
      const spiralStartPos = new Float32Array(spiralDustCount * 3);

      for (let i = 0; i < spiralDustCount; i++) {
        const t = i / spiralDustCount;
        const point = spiralCurve.getPoint(t);
        const spread = 0.25;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const offsetR = Math.random() * spread;
        const offsetX = offsetR * Math.sin(phi) * Math.cos(theta);
        const offsetY = offsetR * Math.sin(phi) * Math.sin(theta) * 0.5;
        const offsetZ = offsetR * Math.cos(phi);

        // Target
        spiralTargetPos[i * 3] = point.x + offsetX;
        spiralTargetPos[i * 3 + 1] = point.y + offsetY;
        spiralTargetPos[i * 3 + 2] = point.z + offsetZ;

        // Start (Random Chaos)
        const startP = getRandomStartPosition();
        spiralStartPos[i * 3] = startP.x;
        spiralStartPos[i * 3 + 1] = startP.y;
        spiralStartPos[i * 3 + 2] = startP.z;

        // Initialize current at start
        spiralDustPos[i * 3] = startP.x;
        spiralDustPos[i * 3 + 1] = startP.y;
        spiralDustPos[i * 3 + 2] = startP.z;
      }

      spiralDustGeo.setAttribute(
        "position",
        new THREE.BufferAttribute(spiralDustPos, 3)
      );

      const ringCanvas = document.createElement("canvas");
      ringCanvas.width = 32;
      ringCanvas.height = 32;
      const rCtx = ringCanvas.getContext("2d");
      rCtx.beginPath();
      rCtx.arc(16, 16, 14, 0, Math.PI * 2);
      rCtx.fillStyle = "#ffffff";
      rCtx.fill();
      rCtx.shadowBlur = 4;
      rCtx.shadowColor = "white";
      const ringTexture = new THREE.CanvasTexture(ringCanvas);
      const spiralDustMat = new THREE.PointsMaterial({
        color: 0xffffff,
        map: ringTexture,
        size: 0.2,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true,
      });
      const spiralDustSystem = new THREE.Points(spiralDustGeo, spiralDustMat);
      treeGroup.add(spiralDustSystem);

      // ------------------------------------------------------------------
      // The Star
      // ------------------------------------------------------------------
      function createStarShape(innerRadius, outerRadius, points) {
        const shape = new THREE.Shape();
        const step = Math.PI / points;
        shape.moveTo(0, outerRadius);
        for (let i = 0; i < 2 * points; i++) {
          const radius = i % 2 === 0 ? outerRadius : innerRadius;
          const angle = i * step;
          shape.lineTo(Math.sin(angle) * radius, Math.cos(angle) * radius);
        }
        shape.closePath();
        return shape;
      }
      const starShape = createStarShape(0.6, 1.5, 8);
      const starGeo = new THREE.ExtrudeGeometry(starShape, {
        depth: 0.4,
        bevelEnabled: true,
        bevelThickness: 0.1,
        bevelSize: 0.05,
        bevelSegments: 4,
      });
      starGeo.center();
      const starMat = new THREE.MeshStandardMaterial({
        color: 0x66bbff,
        emissive: 0x0066ff,
        emissiveIntensity: 0.8,
        roughness: 0.2,
        metalness: 0.1,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.9,
      });
      const star = new THREE.Mesh(starGeo, starMat);
      star.position.set(0, 16.5, 0);
      star.scale.set(0, 0, 0); // Start scale 0
      scene.add(star);

      const starKeyLight = new THREE.PointLight(0x66bbff, 2, 10);
      starKeyLight.position.set(2, 18, 5);
      scene.add(starKeyLight);
      const starRimLight = new THREE.PointLight(0xffffff, 1, 10);
      starRimLight.position.set(-2, 17, -5);
      scene.add(starRimLight);

      const canvas = document.createElement("canvas");
      canvas.width = 32;
      canvas.height = 32;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
      gradient.addColorStop(0, "rgba(100, 200, 255, 0.9)");
      gradient.addColorStop(0.4, "rgba(50, 150, 255, 0.4)");
      gradient.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 32, 32);
      const starGlow = new THREE.Sprite(
        new THREE.SpriteMaterial({
          map: new THREE.CanvasTexture(canvas),
          transparent: true,
          blending: THREE.AdditiveBlending,
        })
      );
      starGlow.scale.set(12, 12, 1);
      star.add(starGlow);

      // ------------------------------------------------------------------
      // Meteors & Ambient Dust
      // ------------------------------------------------------------------
      const meteorLen = 15;
      const meteorGeo = new THREE.PlaneGeometry(meteorLen, 0.4);
      const mCanvas = document.createElement("canvas");
      mCanvas.width = 128;
      mCanvas.height = 32;
      const mCtx = mCanvas.getContext("2d");
      const mGrad = mCtx.createLinearGradient(0, 0, 128, 0);
      mGrad.addColorStop(0, "rgba(255, 255, 255, 0)");
      mGrad.addColorStop(0.8, "rgba(255, 255, 255, 0.5)");
      mGrad.addColorStop(1, "rgba(255, 255, 255, 1)");
      mCtx.fillStyle = mGrad;
      mCtx.fillRect(0, 0, 128, 32);
      const meteorTexture = new THREE.CanvasTexture(mCanvas);
      const meteorMaterial = new THREE.MeshBasicMaterial({
        map: meteorTexture,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
      });
      const meteorPool = [];
      for (let i = 0; i < 5; i++) {
        const instanceMat = meteorMaterial.clone();
        const mesh = new THREE.Mesh(meteorGeo, instanceMat);
        mesh.position.set(0, -100, 0);
        scene.add(mesh);
        meteorPool.push({ mesh: mesh, active: false, speed: 0 });
      }
      const meteorControl = { timer: 0, nextSpawn: Math.random() * 5 + 5 };

      function updateMeteor(delta) {
        meteorControl.timer += delta;
        if (meteorControl.timer > meteorControl.nextSpawn) {
          meteorControl.timer = 0;
          meteorControl.nextSpawn = Math.random() * 5 + 5;
          const countToSpawn = Math.floor(Math.random() * 3) + 1;
          let spawned = 0;
          for (let i = 0; i < meteorPool.length; i++) {
            if (!meteorPool[i].active && spawned < countToSpawn) {
              const m = meteorPool[i];
              m.active = true;
              m.speed = 30 + Math.random() * 20;
              const startX = 30 + Math.random() * 40;
              const startY = 25 + Math.random() * 20;
              const startZ = -30 - Math.random() * 20;
              m.mesh.position.set(startX, startY, startZ);
              m.mesh.rotation.z =
                Math.PI / 6 + Math.PI + (Math.random() * 0.2 - 0.1);
              m.mesh.material.opacity = 1;
              spawned++;
            }
          }
        }
        meteorPool.forEach((m) => {
          if (m.active) {
            m.mesh.position.x -= m.speed * delta * 1.5;
            m.mesh.position.y -= m.speed * delta * 0.8;
            if (m.mesh.position.y < -30 || m.mesh.position.x < -60) {
              m.active = false;
              m.mesh.material.opacity = 0;
            }
          }
        });
      }

      const ambientLight = new THREE.AmbientLight(0x888888, 1.0);
      scene.add(ambientLight);
      const backLight = new THREE.SpotLight(0xaaccff, 5);
      backLight.position.set(0, 10, -20);
      backLight.lookAt(0, 0, 0);
      scene.add(backLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight.position.set(10, 10, 10);
      scene.add(dirLight);
      const blueLight = new THREE.PointLight(0x0044ff, 1.5, 20);
      blueLight.position.set(0, -5, 5);
      scene.add(blueLight);

      const dustGeometry = new THREE.BufferGeometry();
      const dustCount = 1500;
      const dustPos = new Float32Array(dustCount * 3);
      const dustSpeed = [];
      for (let i = 0; i < dustCount * 3; i += 3) {
        dustPos[i] = (Math.random() - 0.5) * 60;
        dustPos[i + 1] = (Math.random() - 0.5) * 60;
        dustPos[i + 2] = (Math.random() - 0.5) * 60;
        dustSpeed.push({
          y: Math.random() * 0.02 + 0.005,
          x: (Math.random() - 0.5) * 0.01,
          z: (Math.random() - 0.5) * 0.01,
        });
      }
      dustGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(dustPos, 3)
      );
      const dustSystem = new THREE.Points(
        dustGeometry,
        new THREE.PointsMaterial({
          color: 0x88ccff,
          size: 0.2,
          transparent: true,
          opacity: 0.6,
          blending: THREE.AdditiveBlending,
        })
      );
      scene.add(dustSystem);

      // ------------------------------------------------------------------
      // Interactions
      // ------------------------------------------------------------------
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2(1000, 1000);
      let isDragging = false;
      let previousMousePosition = { x: 0, y: 0 };
      let rotationSpeed = 0.002;

      function updateMouse(x, y) {
        mouse.x = (x / window.innerWidth) * 2 - 1;
        mouse.y = -(y / window.innerHeight) * 2 + 1;
      }
      document.addEventListener("mousemove", (e) => {
        updateMouse(e.clientX, e.clientY);
        if (isDragging) {
          const deltaX = e.offsetX - previousMousePosition.x;
          const deltaY = e.offsetY - previousMousePosition.y;
          treeGroup.rotation.y += deltaX * 0.01;
          treeGroup.rotation.x += deltaY * 0.01;
          previousMousePosition = { x: e.offsetX, y: e.offsetY };
        }
      });
      document.addEventListener("mousedown", (e) => {
        isDragging = true;
        previousMousePosition = { x: e.offsetX, y: e.offsetY };
      });
      document.addEventListener("mouseup", () => {
        isDragging = false;
      });
      document.addEventListener(
        "touchmove",
        (e) => {
          const touch = e.touches[0];
          updateMouse(touch.clientX, touch.clientY);
          if (isDragging) {
            const deltaX = touch.clientX - previousMousePosition.x;
            const deltaY = touch.clientY - previousMousePosition.y;
            treeGroup.rotation.y += deltaX * 0.01;
            treeGroup.rotation.x += deltaY * 0.01;
            previousMousePosition = { x: touch.clientX, y: touch.clientY };
            e.preventDefault();
          }
        },
        { passive: false }
      );
      document.addEventListener(
        "touchstart",
        (e) => {
          isDragging = true;
          previousMousePosition = {
            x: e.touches[0].clientX,
            y: e.touches[0].clientY,
          };
        },
        { passive: false }
      );
      document.addEventListener("touchend", () => {
        isDragging = false;
        mouse.set(1000, 1000);
      });

      // ------------------------------------------------------------------
      // Animation Loop with Assembly
      // ------------------------------------------------------------------
      const clock = new THREE.Clock();
      const _inverseMatrix = new THREE.Matrix4();
      const _ray = new THREE.Ray();
      const _tempVec = new THREE.Vector3();

      // ASSEMBLY VARS
      let assemblyTime = 0;
      const assemblyDuration = 4.0; // Seconds to assemble
      let isAssembled = false;

      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        const time = Date.now() * 0.001;

        // Assembly Logic
        assemblyTime += delta;
        let progress = Math.min(assemblyTime / assemblyDuration, 1.0);
        // Easing: Cubic Out (Fast start, slow end)
        progress = 1 - Math.pow(1 - progress, 3);

        if (progress >= 1.0 && !isAssembled) {
          isAssembled = true;
          document.getElementById("greeting").style.opacity = "1";
        }

        // Aurora
        auroraUniforms.uTime.value = time;

        if (!isDragging) treeGroup.rotation.y += rotationSpeed;

        // Animate Star (Scale up at end of assembly)
        star.rotation.y = time * 0.5;
        star.rotation.z = Math.sin(time * 0.5) * 0.1;
        const starTargetScale = isAssembled
          ? 1.2
          : progress > 0.8
          ? (progress - 0.8) * 6
          : 0;
        star.scale.set(starTargetScale, starTargetScale, starTargetScale);

        updateSparkles(delta, isAssembled);
        updateMeteor(delta);

        // --- Interaction + Assembly Logic ---
        raycaster.setFromCamera(mouse, camera);
        _inverseMatrix.copy(treeGroup.matrixWorld).invert();
        _ray.copy(raycaster.ray).applyMatrix4(_inverseMatrix);

        let needsUpdateSphere = false,
          needsUpdateCube = false,
          needsUpdateTetra = false,
          needsUpdateDisc = false,
          needsUpdatePlane = false,
          needsUpdateSnowflake = false,
          needsUpdateGlass = false,
          needsUpdateSequinSquare = false,
          needsUpdateSequinRound = false;

        const interactionRadius = 3.5;
        const repulsionStrength = 5.0;

        for (let i = 0; i < particleData.length; i++) {
          const p = particleData[i];

          // 1. Calculate Base Position based on Assembly Progress
          // Interpolate from Start (Chaos) to Original (Tree)
          const basePos = new THREE.Vector3().lerpVectors(
            p.startPosition,
            p.originalPosition,
            progress
          );

          // 2. Apply Interaction Logic on top of Base Position
          _ray.closestPointToPoint(basePos, _tempVec);
          const distSq = basePos.distanceToSquared(_tempVec);
          let targetX = basePos.x,
            targetY = basePos.y,
            targetZ = basePos.z;

          if (isAssembled && distSq < interactionRadius * interactionRadius) {
            const dir = new THREE.Vector3()
              .subVectors(basePos, _tempVec)
              .normalize();
            const dist = Math.sqrt(distSq);
            const force = (1 - dist / interactionRadius) * repulsionStrength;
            targetX += dir.x * force;
            targetY += dir.y * force;
            targetZ += dir.z * force;
          }

          const smoothFactor = delta * 5;
          p.currentPosition.x += (targetX - p.currentPosition.x) * smoothFactor;
          p.currentPosition.y += (targetY - p.currentPosition.y) * smoothFactor;
          p.currentPosition.z += (targetZ - p.currentPosition.z) * smoothFactor;

          // Always update during assembly, or if interaction happens
          const needsUpdate =
            progress < 1.0 ||
            distSq < interactionRadius * interactionRadius ||
            p.currentPosition.distanceToSquared(basePos) > 0.01;

          if (needsUpdate || !isAssembled) {
            dummy.position.copy(p.currentPosition);
            dummy.rotation.copy(p.rotation);
            dummy.rotation.x += time * 0.5;
            dummy.rotation.y += time * 0.5;
            dummy.scale.setScalar(p.baseScale);
            dummy.updateMatrix();
            p.mesh.setMatrixAt(p.index, dummy.matrix);

            if (p.mesh === meshSphere) needsUpdateSphere = true;
            else if (p.mesh === meshCube) needsUpdateCube = true;
            else if (p.mesh === meshTetra) needsUpdateTetra = true;
            else if (p.mesh === meshDisc) needsUpdateDisc = true;
            else if (p.mesh === meshPlane) needsUpdatePlane = true;
            else if (p.mesh === meshSnowflake) needsUpdateSnowflake = true;
            else if (p.mesh === meshGlass) needsUpdateGlass = true;
            else if (p.mesh === meshSequinSquare)
              needsUpdateSequinSquare = true;
            else if (p.mesh === meshSequinRound) needsUpdateSequinRound = true;
          }
        }

        if (needsUpdateSphere) meshSphere.instanceMatrix.needsUpdate = true;
        if (needsUpdateCube) meshCube.instanceMatrix.needsUpdate = true;
        if (needsUpdateTetra) meshTetra.instanceMatrix.needsUpdate = true;
        if (needsUpdateDisc) meshDisc.instanceMatrix.needsUpdate = true;
        if (needsUpdatePlane) meshPlane.instanceMatrix.needsUpdate = true;
        if (needsUpdateSnowflake)
          meshSnowflake.instanceMatrix.needsUpdate = true;
        if (needsUpdateGlass) meshGlass.instanceMatrix.needsUpdate = true;
        if (needsUpdateSequinSquare)
          meshSequinSquare.instanceMatrix.needsUpdate = true;
        if (needsUpdateSequinRound)
          meshSequinRound.instanceMatrix.needsUpdate = true;

        // --- Spiral Dust Assembly ---
        const sPosArr = spiralDustSystem.geometry.attributes.position.array;
        for (let i = 0; i < spiralDustCount; i++) {
          const ix = i * 3;
          const iy = i * 3 + 1;
          const iz = i * 3 + 2;

          // Interpolate Spiral Points
          sPosArr[ix] = THREE.MathUtils.lerp(
            spiralStartPos[ix],
            spiralTargetPos[ix],
            progress
          );
          sPosArr[iy] = THREE.MathUtils.lerp(
            spiralStartPos[iy],
            spiralTargetPos[iy],
            progress
          );
          sPosArr[iz] = THREE.MathUtils.lerp(
            spiralStartPos[iz],
            spiralTargetPos[iz],
            progress
          );
        }
        spiralDustSystem.geometry.attributes.position.needsUpdate = true;

        // --- Ambient Dust Animation ---
        const dustPosArr = dustSystem.geometry.attributes.position.array;
        for (let i = 0; i < dustCount; i++) {
          dustPosArr[i * 3 + 1] -= dustSpeed[i].y;
          dustPosArr[i * 3] += dustSpeed[i].x;
          dustPosArr[i * 3 + 2] += dustSpeed[i].z;
          if (dustPosArr[i * 3 + 1] < -30) dustPosArr[i * 3 + 1] = 30;
        }
        dustSystem.geometry.attributes.position.needsUpdate = true;

        starGlow.material.opacity = 0.5 + Math.sin(time * 2) * 0.2;
        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      document.getElementById("loading").style.display = "none";
      animate();
    </script>
  </body>
</html>
